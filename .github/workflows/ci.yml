name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The e2e mail tests send over real SMTP and read the message back out, so the
      # SMTP server has to exist here too. Mailpit needs no command, so unlike the S3
      # server it can be a service container.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
      # The S3 server is NOT a service container: it needs a command, and a services
      # block cannot set one. It is started as a step below.

    env:
      NODE_ENV: test
      # Real environment variables take precedence over .env.test, so the committed
      # file stays useful locally while CI points at its own service containers.
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_test?schema=public
      TEST_DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_test?schema=public
      # prisma.config.ts reads this at load time, so every prisma command needs it
      # present even when the command itself never uses a shadow database.
      SHADOW_DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_shadow?schema=public
      # Database 1, matching .env.test: the rate-limit suite flushes it.
      REDIS_URL: redis://localhost:6379/1
      SWAGGER_ENABLED: 'true'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: ecommerce-test
      # S3Mock ignores credentials, but the SDK insists on having some.
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_PUBLIC_BASE_URL: http://localhost:9000/ecommerce-test
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: no-reply@pupgy.test
      STOREFRONT_URL: http://localhost:3001
      SELLER_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No separate extension step: `db:test:prepare` recreates the schema and its
      # extensions together, so CI runs exactly what a developer runs.
      # The image tests upload through a presigned URL to a real S3 server, because
      # presigning and the post-upload HeadObject check are the whole feature.
      #
      # Not MinIO: both minio/minio and quay.io/minio/minio now refuse anonymous
      # pulls, and bitnami/minio was withdrawn entirely. S3Mock is a real HTTP S3
      # implementation built for tests, and it does not depend on any vendor's
      # distribution decisions. Development still runs MinIO (see
      # ecommerce-infrastructure) — the suite passes against both, which is the
      # evidence that our code is not tied to one implementation.
      - name: Start S3 server
        run: |
          docker run -d --name s3 -p 9000:9090 adobe/s3mock:latest
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:9000/ && exit 0
            sleep 2
          done
          echo "S3 server did not become healthy" >&2
          docker logs s3
          exit 1

      - run: pnpm prisma:generate

      # Migrations and seeding are not separate steps: `test:e2e` runs
      # `db:test:prepare` itself, so a green CI proves the command a developer
      # actually types works, rather than a CI-only variant of it.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e

      # The contract is part of the code review: a controller change that was not
      # regenerated fails here rather than surprising a frontend team later.
      - name: Check OpenAPI contract is up to date
        run: pnpm openapi:check

  # Only after verify is green, and only on main: an image in the registry is a
  # deployable artefact, so it should never exist for code that failed its tests.
  # Building here rather than on the VPS is what keeps a 1 GB server viable — the
  # server only ever pulls.
  image:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Two tags per build: `latest` for the normal deploy, and the commit SHA so
          # a rollback has something precise to point at.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The VPS is amd64; building one architecture keeps the job under a minute.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
